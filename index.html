<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 PIKATILFLAY Bet - Simulador Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="logo">🎰 PIKATILFLAY BET</h1>
            <p class="subtitle">Simulador Premium</p>
        </div>

        <div class="saldo-card">
            <div class="saldo-icon">
                <i class="fas fa-wallet"></i>
            </div>
            <div class="saldo-label">Saldo Atual</div>
            <div class="saldo-value" id="saldo">R$ 10.000,00</div>
        </div>

        <div class="input-group">
            <input type="number" id="aposta" class="input-field" placeholder="💰 Digite o valor da aposta" min="1">
        </div>

        <button class="btn-apostar" onclick="apostar()">
            <i class="fas fa-dice"></i> ROLAR OS DADOS
        </button>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
